spring.application.name=be

spring.datasource.url=jdbc:mysql://localhost:3306/shoe_store?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Email configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=22130309@st.hcmuaf.edu.vn
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}

# GHN Configuration
ghn.api.token=${GHN_API_TOKEN}
ghn.shop.id=${GHN_SHOP_ID}
# URLs
ghn.api.url.fee=https://dev-online-gateway.ghn.vn/shiip/public-api/v2/shipping-order/fee
ghn.api.url.province=https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/province
ghn.api.url.district=https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/district
ghn.api.url.ward=https://dev-online-gateway.ghn.vn/shiip/public-api/master-data/ward
